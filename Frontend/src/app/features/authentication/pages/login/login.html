<section class="login-page">
  <mat-card appearance="outlined" class="login-card">
    <header>
      <p class="eyebrow">Task Manager</p>
      <h1>Welcome</h1>
      <p>Authentication is securely handled by Keycloak.</p>
    </header>

    <mat-card-content>
      <button mat-flat-button type="button" (click)="login()">Sign in</button>
      <button mat-button type="button" (click)="register()">Create an account</button>
    </mat-card-content>
  </mat-card>
</section>
